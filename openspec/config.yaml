schema: spec-driven

context: |
  Tech stack: vanilla JavaScript (ES modules, no TypeScript, no framework), Vite 7, Bun (runtime and package manager), ZenFS virtual file system, os-gui + jQuery for windows and menus, xterm.js, Playwright for e2e
  Static client-only app deployed to GitHub Pages under the base path /win98-web/ (vite.config.js). There is no backend. Persistence is IndexedDB through ZenFS plus localStorage
  Architecture: modular desktop shell. src/system (kernel-like managers) -> src/shell (desktop, taskbar, start menu, explorer) -> src/apps/<app> (windowed apps) -> src/shared (dialogs, utils, styles), driven by src/config (single source of truth for apps, icons, themes, sounds, start menu, file associations)
  Boot: src/main.js -> src/system/os-init.js (initializeOS) builds window.System (WindowManager) and attaches launchApp, appManager, themeManager, cursorManager. Use window.System.launchApp(appId, data) to start apps and window.fs (ZenFS) for files
  Globals: os-gui exposes $Window and MenuBar as globals. Windows are jQuery-based. The modified os-gui in public/os-gui/ overrides the npm os-gui package
  Commands:
  - bun run dev              Vite dev server at http://localhost:5173/win98-web/
  - bun run build            runs build:registry first, then vite build
  - bun run build:registry   regenerates src/config/app-registry.js
  - bun run test             Playwright e2e (starts bun run dev itself)
  - bun x playwright test e2e/<file>.spec.js   single e2e file
  Always use bun, never npm, for scripts and installs. There is no unit-test runner and no linter configured. Do not add one without asking
  Commits follow Conventional Commits (feat:, fix:, chore:, docs:, refactor:, test:) because Release Please builds CHANGELOG.md and the version from them. Never edit CHANGELOG.md, .release-please-manifest.json or the package.json version by hand
  All code, comments, commit messages and documentation in English

  Project guidelines: AGENTS.md is the project guide and .agents/rules/ holds centralized agent rules (graphify). Read both before designing. Where they disagree with the code, the code wins (see the traps below)

  Knowledge graph (read before exploring): graphify-out/ holds a code graph of this repo (vendored and generated code is excluded by .graphifyignore).
  - For architecture or "what depends on X" questions run `graphify query "<question>"`, `graphify explain "<node>"`, `graphify path "<A>" "<B>"` or `graphify affected "<node>"` BEFORE grepping or reading many files
  - Use `graphify affected "<file or symbol>"` to size the blast radius when writing proposals and designs
  - Read graphify-out/GRAPH_REPORT.md only for broad architecture review
  - After changing code run `graphify update .` (AST only, no API cost). A large diff in graphify-out/graph.json is expected

  Codebase conventions (follow the existing code instead of introducing new patterns):
  - An app is src/apps/<app-id>/<app-id>-app.js exporting a class that extends Application (src/system/application.js) with a literal `static config = { id, title, description, icon: ICONS.x, width, height, resizable, isSingleton, ... }`. Window creation goes in _createWindow(), using $Window and MenuBar
  - TRAP: apps are NOT discovered by a Vite glob at runtime. src/config/app-registry.js is GENERATED by scripts/generate_registry.js and committed. The generator extracts `static config = ...;` with a regex up to the first semicolon, so keep config a plain object literal with no semicolons inside it and no logic. After adding or changing an app config run `bun run build:registry` and commit the regenerated registry. AGENTS.md, src/apps/README.md and .github/copilot-instructions.md still describe older or glob-based flows
  - Icons: files in src/assets/icons/, registered in src/config/icons.js as ICONS.name = { 16: url, 32: url } with new URL(..., import.meta.url).href. Apps reference ICONS, never raw paths
  - Desktop icons: src/config/desktop.json and special-folders.js. Start menu: src/config/start-menu.js. File associations: src/config/file-associations.js. Themes, sounds, cursors, wallpapers, screensavers each have their own file in src/config
  - Shared building blocks to reuse: ShowDialogWindow (src/shared/components/dialog-window.js, the most used module with 140+ dependents), ShowFilePicker, getItem/setItem/LOCAL_STORAGE_KEYS (src/system/local-storage.js, add new keys there), joinPath and path helpers (src/system/path.js), busy-state-manager, clipboard-manager, sound-manager
  - Files: use ZenFS (fs from @zenfs/core). User data lives under /C:/My Documents/ and /C:/WINDOWS/ so it persists. Never write to the host file system
  - Visual fidelity: 98.css, os-gui and theme CSS variables drive the look. Reuse existing classes and CSS custom properties, keep per-app CSS in the app folder, do not use modern-looking UI frameworks or rounded flat styles
  - Each app folder has a README.md with a "## Screenshot" section and a screenshot.png (checked by scripts/verify_changes.sh). Update the app table in src/apps/README.md when adding an app
  - Vendored or third-party code, do not reformat or refactor: public/ (games, plus-screensavers, pipes, maze, apps/*/lib, jquery), ms-agent.js, the paint port under src/apps/paint/src (large and ported from JS Paint), dist/. Only touch it for a targeted fix and say why
  - Changes to window-manager.js, application.js, app-manager.js, os-init.js, zenfs-init.js and local-storage.js affect every app. Treat them as high-risk and list the affected areas in the proposal

rules:
  proposal:
    - Always include a Non-goals section
    - State which layer is affected (system, shell, an app, shared, config, public/os-gui) and list the concrete files
    - Use `graphify affected` on any shared module (Application, ShowDialogWindow, getItem/setItem, ICONS, launchApp, ZenFS helpers) and summarize the blast radius
    - State persistence impact (new localStorage keys, new ZenFS paths, migration of existing user data, as in migrate-shortcuts.js)
    - State authenticity impact - the behavior or look must match Windows 98. Cite the Windows 98 behavior being reproduced when relevant
    - Keep the proposal short and focused on why and what
  specs:
    - Write scenarios in Given/When/Then format
    - Organize by feature area matching the project (desktop, taskbar-and-start-menu, explorer, window-management, file-system, themes-and-sounds, apps/<app-id>)
    - Include edge cases - singleton app launched twice, closing with unsaved changes, minimize/restore, missing file or path, empty folder, reload with persisted state, low-resolution screen
    - Describe user-observable behavior (what is shown, clicked, announced), not implementation
    - Include keyboard behavior for any interactive control
  design:
    - Run `graphify query` or `graphify explain` on the affected area first and reference the existing modules you reuse
    - Follow the existing layering - system managers have no dependency on apps, shell depends on system, apps depend on system and shared, config wires everything. Do not add upward dependencies
    - For a new app, specify the id, config literal, icon entries, desktop/start-menu/file-association entries and whether it runs in an iframe (see iframe-application.js) or natively
    - Prefer reusing ShowDialogWindow, ShowFilePicker, local-storage helpers and ZenFS helpers over new code
    - Define persistence explicitly - key names in LOCAL_STORAGE_KEYS, ZenFS paths, and the fallback for missing or old data
    - Describe window lifecycle - creation, focus, minimize, close, singleton rules, cleanup of listeners, timers, audio and workers on close
    - Note performance and bundle impact for large assets (use dynamic import or public/ assets, as with games and wasm)
    - State how the change is verified with Playwright when it has UI behavior
  tasks:
    - Group tasks by layer - config and shared helpers first, then system, then shell, then the app, then docs and screenshots
    - Tasks that add behavior with testable UI (a launchable app, dialog, shell interaction) include writing a Playwright e2e spec in e2e/ that boots, waits for window.System.launchApp and asserts on DOM, then implementing it. Follow the existing specs (see e2e/address-bar.spec.js)
    - Pure wiring tasks (icons, config entries, CSS, README, registry regeneration) are plain tasks without test steps
    - Keep tasks small enough to implement and check in one sitting and name the exact files they touch
    - If an app static config is added or changed, include a task to run `bun run build:registry` and commit src/config/app-registry.js
    - If an app is added, include tasks for the icon in src/assets/icons plus src/config/icons.js, the app README.md with screenshot, and the src/apps/README.md table row
    - Manual verification task for visual work - run `bun run dev`, open /win98-web/, exercise the change at the default theme and one other theme, and check the console for errors
    - Do not mock ZenFS or window.System in e2e tests. Run the real app
    - Always include a final validation group - `bun run build` (which also regenerates the registry), `bun run test` (or the specific specs touched), then `graphify update .`
    - Always include a final task - commit all changes with a Conventional Commit message (for example "feat(notepad): add find and replace dialog")

operations:
  apply:
    guidance:
      - Read the relevant modules and run `graphify query` or `graphify explain` before editing. Match the surrounding style, which is 2-space indentation and ES modules. Quote style varies by file, so follow the file you edit
      - Implement one task at a time and tick it off in tasks.md right after it is verified
      - Run `bun run build:registry` after editing any static config and `bun run build` before declaring the work done
      - Do not modify vendored code (public/games, public/apps, public/pipes, public/plus-screensavers, ms-agent.js, dist/) except for an explicitly planned targeted fix
      - Do not hand-edit CHANGELOG.md, the version in package.json or .release-please-manifest.json
      - Stop and ask when a task needs a new dependency, a change to public/os-gui internals, or a change to window.System shape
      - Run `graphify update .` after finishing code changes
  archive:
    guidance:
      - Confirm `bun run build` and the relevant Playwright specs passed before archiving
      - Summarize the archive outcome, including new localStorage keys, ZenFS paths or migrations that existing users will hit
