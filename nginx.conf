map $uri $win98_cache {
    default "";
    ~(/|\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ "no-cache";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types
        text/css
        application/javascript
        text/javascript
        application/json
        image/svg+xml
        application/manifest+json
        application/wasm
        text/plain
        application/xml;

    add_header Cache-Control $win98_cache;

    location / {
        return 404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /win98-web {
        return 301 /win98-web/;
    }

    location ^~ /win98-web/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /win98-web/ {
        try_files $uri $uri/index.html @app_fallback;
    }

    location @app_fallback {
        if ($uri ~ ^/win98-web/[^/.]+/?$) {
            rewrite ^ /win98-web/index.html last;
        }
        return 404;
    }

    error_page 404 /win98-web/404.html;
}
